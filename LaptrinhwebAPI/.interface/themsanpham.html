<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm sản phẩm | Admin</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background-image: url("images/ethereal-11.jpg");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
            image-rendering: -webkit-optimize-contrast;
        }

        /* overlay tăng tương phản – giữ ảnh nét */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.05); /* sáng hơn */
            z-index: -1;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            /* background: rgba(20,20,20,0.55); */
            backdrop-filter: blur(20px);
            color: #333;
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        header h1 {
            font-size: 20px;
        }

        .back-btn {
            position: absolute;
            left: 40px;
            width: 55px;
            height: 35px;
            border-radius: 20px;
            background: rgba(255,255,255,0.25);
            color: #333;
            font-size: 20px;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.25s;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.45);
            transform: scale(1.1);
        }

        .container {
            max-width: 600px;
            margin: 10px auto;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(18px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            margin-top: 75px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #111;
        }

        label {
            display: block;
            margin: 15px 0 6px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ccc;
            outline: none;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #111, #333);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
        }

        button:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #000, #222);
        }
        footer { 
            text-align:center; padding:20px; 
            /* background:rgba(0,0,0,0.7);  */
            color:#aaa; backdrop-filter: blur(10px); 
        }
    </style>
</head>

<body>

<header>
    <a class="back-btn" href="sanpham.html">←</a>
    <h1>➕ Thêm sản phẩm</h1>
</header>

<section class="container">
    <h2>📦 Thông tin sản phẩm</h2>

    <form id="productForm">
        <label>Tên sản phẩm</label>
        <input type="text" id="ten" required>

        <label>Giá (VND)</label>
        <input type="number" id="gia" required>

        <label>Số lượng</label>
        <input type="number" id="soluong" required>

        <label>Màu sắc</label>
        <input type="text" id="mausac">

        <label>Dung lượng</label>
        <input type="text" id="dungluong">

        <label>Đường dẫn hình ảnh</label>
        <input type="text" id="hinhanh" placeholder="imagesMySQL/iphone12promax.png hoặc https://...">

        <label>Danh mục</label>
        <select id="danhmuc_id" required>
            <option value="">-- Chọn danh mục --</option>
            <option value="1">iPhone</option>
            <option value="2">iPad</option>
            <option value="3">MacBook</option>
            <option value="4">Apple Watch</option>
            <option value="5">AirPods</option>
            <option value="6">Accessories</option>
        </select>

        <button type="submit">💾 Lưu sản phẩm</button>
    </form>
</section>

<footer>
    Lê Nguyễn Mạnh Hùng - 10123153
</footer>

<script>
document.getElementById("productForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const data = {
        ten: ten.value,
        gia: Number(gia.value),
        soluong: Number(soluong.value),
        mausac: mausac.value,
        dungluong: dungluong.value || null,
        hinh_anh: hinhanh.value || null,
        danhmuc_id: Number(danhmuc_id.value)
    };

    const res = await fetch("http://localhost:3000/api/sanphams", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    });

    if (res.ok) {
        alert("✅ Thêm sản phẩm thành công!");
        window.location.href = "sanpham.html";
    } else {
        alert("❌ Lỗi khi thêm sản phẩm");
    }
});
</script>

</body>
</html>
