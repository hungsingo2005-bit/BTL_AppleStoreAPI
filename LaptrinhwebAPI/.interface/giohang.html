<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giỏ hàng | Mạnh Hùng Shop</title>
<style>
* { box-sizing: border-box; margin:0; padding:0; }

body {
    font-family: Arial, sans-serif;
    background: url("images/ethereal-09.jpg") no-repeat center center fixed;
    background-size: cover;
    padding-top: 90px; /* để header không che */
}

body::before {
    content:"";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.05);
    z-index: -1;
}

header {
    position: fixed;
    top: 0; width: 100%; z-index:1000;
    color:#333;
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    padding: 15px 40px;
    display:flex; align-items:center; justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.4);
}

.slider-nav {
    position: relative;
    display:flex;
    width:420px; height:46px;
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(18px);
    border-radius:40px;
    padding:4px;
    border:1px solid rgba(255,255,255,0.4);
}

.slider-item {
    flex:1;
    text-align:center;
    line-height:38px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    z-index:2;
    transition:opacity 0.3s;
}
.slider-item:hover { opacity:0.7; }

.slider-indicator {
    position:absolute;
    top:4px; left:17px;
    width: calc(25% - 8px);
    height: calc(100% - 8px);
    background: rgba(255,255,255,0.35);
    border-radius:30px;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.6),
                0 6px 20px rgba(0,0,0,0.15);
    transition: transform 0.4s cubic-bezier(.18,.89,.32,1.28);
    z-index:1;
}

/* ===== GIỎ HÀNG ===== */
.cart-item {
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(16px);
    display: flex;
    align-items: center;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
    border:1px solid rgba(255,255,255,0.35);
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

.cart-item img {
    width: 80px;
    margin-right: 15px;
    border-radius:8px;
}

.cart-item h3 {
    flex: 1;
    font-size: 16px;
    color:#222;
}

.cart-item span {
    width: 140px;
    color:#222;
}

.cart-item button {
    background: red;
    color: #fff;
    border: none;
    padding: 6px 10px;
    cursor: pointer;
    border-radius:6px;
}

.total {
    font-size: 20px;
    font-weight: bold;
    margin-top: 20px;
    color:#222;
}

a, .btn-buy-now {
    display: inline-block;
    margin-top: 20px;
    text-decoration: none;
    color:#fff;
    background: rgba(0,0,0,0.3);
    padding: 8px 15px;
    border-radius:6px;
    transition:0.3s;
}
a:hover, .btn-buy-now:hover { background: rgba(0,0,0,0.5); }
/* ===== FOOTER ===== */
/* footer {
    text-align: center;
    padding: 20px;
    margin-top: 40px;
    color: #555;

    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.4);
} */
</style>
</head>

<body>

<header>
    <h1>🍎AppleStore</h1>
    <div class="slider-nav">
        <div class="slider-item" data-url="web.html">Trang chủ</div>
        <div class="slider-item" data-url="sanpham.html">Sản phẩm</div>
        <div class="slider-item" data-url="giohang.html">Giỏ hàng</div>
        <div class="slider-item" id="authBtn" data-url="interface.html">Đăng nhập</div>
        <div class="slider-indicator" id="slider"></div>
    </div>
</header>

<h1 style="margin:20px 40px;">🛒 Giỏ hàng của bạn</h1>
<div id="cart" style="margin:20px 40px;"></div>
<div class="total" id="total" style="margin:20px 40px;"></div>
<a href="web.html">⬅ Quay lại mua hàng</a>
<a class="btn-buy-now" href="thanhtoansanpham.html">⚡ Thanh toán ngay</a>

<script>
// ===== SLIDER NAV =====
const slider = document.getElementById("slider");
const items = document.querySelectorAll(".slider-item");
const authBtn = document.getElementById("authBtn");
const token = localStorage.getItem("token");

// Highlight mục tương ứng theo trang hiện tại
const currentPage = window.location.pathname.split("/").pop();
let activeIndex = Array.from(items).findIndex(i => i.dataset.url === currentPage);
if (activeIndex === -1) activeIndex = 0;
slider.style.transform = `translateX(${activeIndex*100}%)`;

items.forEach((item, index) => {
    item.onclick = () => {
        if(item === authBtn) return;
        slider.style.transform = `translateX(${index*100}%)`;
        setTimeout(() => { window.location.href = item.dataset.url }, 250);
    };
});

if(token) {
    authBtn.innerText = "Đăng xuất";
    authBtn.onclick = () => {
        if(confirm("Bạn có chắc muốn đăng xuất không?")) {
            localStorage.removeItem("token");
            location.reload();
            window.location.href = "web.html";
        }
    };
} else {
    authBtn.innerText = "Đăng nhập";
    authBtn.onclick = () => {
        window.location.href = authBtn.dataset.url;
    };
}

// ===== LOAD GIỎ HÀNG TỪ LOCALSTORAGE =====
function loadCart() {
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    const cartDiv = document.getElementById("cart");
    cartDiv.innerHTML = "";
    let total = 0;

    cart.forEach((item, index) => {
        total += item.gia * item.soluong;
        const div = document.createElement("div");
        div.className = "cart-item";
        div.innerHTML = `
            <img src="${item.hinh_anh}" alt="${item.ten}">
            <h3>${item.ten}</h3>
            <span>${Number(item.gia).toLocaleString()} đ x ${item.soluong}</span>
            <button onclick="removeItem(${index})">❌</button>
        `;
        cartDiv.appendChild(div);
    });

    document.getElementById("total").innerText = `Tổng: ${total.toLocaleString()} đ`;
}

// Xóa sản phẩm
function removeItem(index){
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    cart.splice(index,1);
    localStorage.setItem("cart", JSON.stringify(cart));
    loadCart();
}

// Khi bấm "Thanh toán ngay", lưu giỏ vào localStorage tạm cho trang thanh toán
document.querySelector(".btn-buy-now").onclick = () => {
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    localStorage.setItem("checkout", JSON.stringify(cart)); // lưu tạm
};

loadCart();
</script>
</body>
</html>
