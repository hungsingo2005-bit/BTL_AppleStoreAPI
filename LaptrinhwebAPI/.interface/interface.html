<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập / Đăng ký</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: url("images/ethereal-09.jpg") no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }

        /* Overlay nhẹ để chữ dễ đọc */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.05);
            z-index: -1;
        }

        .box {
            background: rgba(255, 255, 255, 0.25); /* khớp header */
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            width: 360px;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        h2 { text-align: center; margin-bottom: 15px; color:#333; }

        /* ==== Liquid Glass Inputs & Selects ==== */
        input, select {
            width: 100%;
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: #333;
            font-size: 15px;
            box-shadow: 
                inset 0 1px 0 rgba(255,255,255,0.6),
                0 6px 12px rgba(0,0,0,0.15),
                0 3px 5px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        input::placeholder, select option {
            color: rgba(51,51,51,0.7);
        }

        input:focus, select:focus {
            outline: none;
            background: rgba(255,255,255,0.25);
            box-shadow: 
                inset 0 1px 0 rgba(255,255,255,0.8),
                0 8px 20px rgba(0,0,0,0.25),
                0 4px 8px rgba(0,0,0,0.15);
        }

        button {
            width: 60%; /* nhỏ lại 80% */
            margin: 0 auto; /* căn giữa */
            display: block; /* để margin auto hiệu quả */
            padding: 12px 0;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: #fff;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 
                inset 0 1px 0 rgba(255,255,255,0.6),
                0 8px 15px rgba(0,0,0,0.2),
                0 4px 6px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
        }

        button:hover {
            color: #333;
            background: rgba(255,255,255,0.3);
            transform: scale(1.03);
            box-shadow: 
                inset 0 1px 0 rgba(255,255,255,0.7),
                0 12px 25px rgba(0,0,0,0.25),
                0 6px 8px rgba(0,0,0,0.2);
        }

        .switch {
            text-align: center;
            margin-top: 10px;
            cursor: pointer;
            color: #333;
        }

        
    </style>
</head>
<body>

<div class="box">
    <h2 id="title">Đăng nhập</h2>

    <!-- ĐĂNG NHẬP -->
    <form id="loginForm">
        <input id="loginEmail" type="email" placeholder="Email" required>
        <input id="loginPassword" type="password" placeholder="Mật khẩu" required>
        <button type="submit">Đăng nhập</button>
    </form>

    <!-- ĐĂNG KÝ -->
    <form id="registerForm" style="display:none;">
        <input id="name" type="text" placeholder="Họ và tên (>= 3 ký tự)" required>
        <input id="email" type="email" placeholder="Email" required>
        <input id="password" type="password" placeholder="Mật khẩu (>= 6 ký tự)" required>
        <input id="phone" type="tel" placeholder="Số điện thoại (không bắt buộc)">

        <select id="role" required>
            <option value="">-- Chọn vai trò --</option>
            <option value="User">User</option>
            <option value="Admin">Admin</option>
        </select>

        <button type="submit">Đăng ký</button>
    </form>

    <div class="switch" onclick="toggleForm()">
        Chưa có tài khoản? Đăng ký
    </div>
</div>

<script>
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const title = document.getElementById("title");

    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const phoneInput = document.getElementById("phone");
    const roleSelect = document.getElementById("role");

    const loginEmail = document.getElementById("loginEmail");
    const loginPassword = document.getElementById("loginPassword");

    let isLogin = true;

    function toggleForm() {
        isLogin = !isLogin;
        loginForm.style.display = isLogin ? "block" : "none";
        registerForm.style.display = isLogin ? "none" : "block";
        title.innerText = isLogin ? "Đăng nhập" : "Đăng ký";
        document.querySelector(".switch").innerText =
            isLogin ? "Chưa có tài khoản? Đăng ký" : "Đã có tài khoản? Đăng nhập";
    }

    registerForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const data = {
            name: nameInput.value.trim(),
            email: emailInput.value.trim(),
            password: passwordInput.value,
            phone: phoneInput.value.trim() || undefined
        };
        if (roleSelect.value) data.role = roleSelect.value;

        try {
            const res = await fetch("http://localhost:3000/api/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            if (!res.ok) { alert(result.message || "Đăng ký thất bại"); return; }
            alert("🎉 Đăng ký thành công");
            registerForm.reset();
            toggleForm();
        } catch (err) { alert("❌ Không kết nối được tới server"); }
    });

    loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const data = { email: loginEmail.value.trim(), password: loginPassword.value };
        try {
            const res = await fetch("http://localhost:3000/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            if (!res.ok) { alert(result.message || "Sai thông tin đăng nhập"); return; }
            localStorage.setItem("token", result.token);
            alert("✅ Đăng nhập thành công");
            window.location.href = "web.html";
        } catch (err) { alert("❌ Không kết nối được tới server"); }
    });
</script>

</body>
</html>
