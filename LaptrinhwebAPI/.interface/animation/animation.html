<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Segmented Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            /* Màu nền gradient giống trong ảnh */
            --bg-gradient: linear-gradient(135deg, #cc718d 0%, #7d4d91 50%, #4a336e 100%);
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
            --selection-bg: rgba(255, 255, 255, 0.3);
            --icon-color: #1a0b2e;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: var(--bg-gradient);
            font-family: sans-serif;
        }

        /* Container chính của thanh trượt */
        .segmented-control {
            position: relative;
            display: flex;
            width: 320px;
            height: 70px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px); /* Hiệu ứng kính mờ */
            -webkit-backdrop-filter: blur(15px);
            border-radius: 50px;
            padding: 6px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        /* Ẩn các nút radio gốc */
        input[type="radio"] {
            display: none;
        }

        /* Các nhãn chứa biểu tượng */
        .option {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 2;
            font-size: 24px;
            color: var(--icon-color);
            transition: color 0.3s ease;
        }

        /* Thanh trượt (khối chọn) */
        .selection {
            position: absolute;
            top: 6px;
            left: 6px;
            width: calc(33.33% - 12px);
            height: calc(100% - 12px);
            background: var(--selection-bg);
            border-radius: 40px;
            z-index: 1;
            transition: transform 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.4);
        }

        /* Logic di chuyển thanh trượt khi chọn */
        #light:checked ~ .selection {
            transform: translateX(0);
        }

        #dark:checked ~ .selection {
            transform: translateX(100%);
        }

        #auto:checked ~ .selection {
            transform: translateX(200%);
        }

        /* Hiệu ứng hover nhẹ */
        .option:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="segmented-control">
        <input type="radio" name="mode" id="light" checked>
        <label for="light" class="option">
            <i class="fas fa-sun"></i>
        </label>

        <input type="radio" name="mode" id="dark">
        <label for="dark" class="option">
            <i class="fas fa-moon"></i>
        </label>

        <input type="radio" name="mode" id="auto">
        <label for="auto" class="option">
            <i class="fas fa-sun-plant-wilt"></i>
        </label>
        
        <div class="selection"></div>
    </div>

</body>
</html>
